services:
  livox_driver:
    image: nolan.azurecr.io/image-terramax-ros2h-livox_amd64:test-livox-build-pipeline-2
    container_name: test_livox_driver
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY=${DISPLAY}
      - LD_LIBRARY_PATH="/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["/bin/bash", "-lc", "source /ros2_ws/install/setup.bash && ros2 launch livox_ros_driver2 pcl_hap.launch.py"]

